# Domain → service → category rules for the DNS usage module.
#
# Hand-maintained, works offline, MIT like the rest of the project.
#
# Matching: a rule for `example.com` matches `example.com` and every subdomain
# (`cdn.example.com`). The longest matching rule wins, so `youtubei.googleapis.com`
# beats the shared `googleapis.com`. `exact:` rules match only that one name.
#
# Only list domains that belong to ONE service. Shared infrastructure (CDNs, cloud
# hosting, big platforms serving many products) goes under `shared` - naming a
# service there would be made up. A query to fastly.net says nothing about which
# website was behind it.
#
# confidence: high   = the domain is operated by and only used for this service
#             medium = mostly this service, but also embedded elsewhere (SDKs, widgets)
#             low    = shared infrastructure
#
# Overrides without editing this file: `domain_categories.local.yaml` in the data
# directory (same format, wins over this file) or the manual rules in the web UI
# (win over everything).

