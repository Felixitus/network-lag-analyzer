name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Syntax install.sh
        run: bash -n install.sh
      - name: shellcheck
        run: shellcheck -S error install.sh
      - name: Line endings (LF)
        run: "! git ls-files --eol | grep -v 'frontend/vendor' | grep -E 'i/crlf|w/crlf'"

  systemd:
    # A typo in the unit or a dropped hardening line would otherwise only show on the Pi.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify the unit
        run: |
          # verify wants ExecStart to exist; install.sh creates the venv there
          sudo install -d /opt/network-lag-analyzer/venv/bin
          sudo ln -s "$(command -v python3)" /opt/network-lag-analyzer/venv/bin/python
          systemd-analyze verify deploy/network-lag-analyzer.service
      - name: Hardening score
        # 2.7 on the Pi (systemd 252); the threshold is on a 0-100 scale, so 30 means 3.0
        run: systemd-analyze security --offline=yes --threshold=30 --no-pager deploy/network-lag-analyzer.service

  frontend:
    # The frontend has no build step, so nothing else would notice a syntax error:
    # twice a page stayed blank because of one, and only a look at the browser caught it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: JavaScript syntax (ES modules)
        run: |
          echo '{"type": "module"}' > frontend/package.json
          status=0
          for f in $(git ls-files 'frontend/js/*.js' 'frontend/js/**/*.js'); do
            node --check "$f" || status=1
          done
          exit $status
      - name: Unit tests of the helpers
        run: node --test tests/frontend/*.test.mjs
