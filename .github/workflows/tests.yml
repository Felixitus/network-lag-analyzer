name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Syntax install.sh
        run: bash -n install.sh
      - name: shellcheck
        run: shellcheck -S error install.sh
      - name: Line endings (LF)
        run: "! git ls-files --eol | grep -v 'frontend/vendor' | grep -E 'i/crlf|w/crlf'"

  frontend:
    # The frontend has no build step, so nothing else would notice a syntax error:
    # twice a page stayed blank because of one, and only a look at the browser caught it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
      - name: JavaScript syntax (ES modules)
        run: |
          echo '{"type": "module"}' > frontend/package.json
          status=0
          for f in $(git ls-files 'frontend/js/*.js' 'frontend/js/**/*.js'); do
            node --check "$f" || status=1
          done
          exit $status
