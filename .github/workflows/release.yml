name: Release

# Pushing a tag v1.2.3 publishes the release with that version's CHANGELOG section as notes.
# Only the owner can push tags, release tags cannot be moved (ruleset), and main only holds green commits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_notes.py "$TAG" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Made by hand already: left as it is
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists already"
          else
            gh release create "$TAG" --verify-tag --title "Version ${TAG#v}" --notes-file notes.md
          fi
