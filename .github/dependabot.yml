# The CI actions are pinned to commit SHAs, so they no longer move on by themselves:
# one grouped PR a month brings them up to date (the comment with the version is updated too).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
