# Network Lag Analyzer - configuration
# File: /etc/network-lag-analyzer/config.yaml
# Almost every value can also be changed in the web UI (Setup); those changes
# are stored in the database and take precedence over this file.

server:
  host: 0.0.0.0        # reachable on the LAN only (do not forward the port in the router)
  port: 8088           # Pi-hole uses 80/443

gateway: auto          # or e.g. 192.168.178.1

targets:
  - address: 1.1.1.1
    name: Cloudflare
  - address: 8.8.8.8
    name: Google
  - address: 9.9.9.9
    name: Quad9

probe:
  interval: 1.0          # seconds between pings per target
  gaming_interval: 0.25  # in Gaming Mode
  timeout: 1.5           # later = lost

gaming_pc:
  ip: null               # e.g. 192.168.178.20 (or mark it in the device list)

gaming:
  auto_detect: true

thresholds:
  ping_warning: 50
  ping_critical: 100
  jitter_warning: 20
  packet_loss_warning: 1
  gateway_warning: 20
  high_upload_pct: 70
  high_download_pct: 80

capacity:              # booked line in Mbit/s; "auto" = link rate of the FRITZ!Box
  down_mbit: auto
  up_mbit: auto

fritzbox:
  enabled: false       # set to true and enter the credentials
  host: auto
  username: ""         # a dedicated user with the "FRITZ!Box Settings" permission
  password: ""
  capture_enabled: true
  capture_interface: 1-lan
  snaplen: 128

capture:
  source: auto         # auto | fritzbox | local | none
  local_interface: eth0

pihole:
  enabled: true
  ftl_db: /etc/pihole/pihole-FTL.db

# Name resolution: two probes that tell different things.
dns_probe:
  enabled: true
  interval: 5.0
  # Cached - only measures whether your own resolver (Pi-hole) still responds.
  query_name: example.com
  # Uncached - a random name under this suffix forces the full path to the
  # upstream. ".invalid" is reserved for this (RFC 2606); the NXDOMAIN answer
  # counts as success. Leaving it empty disables the second probe.
  uncached_suffix: nla-probe.invalid
  servers: [local, 1.1.1.1]

retention:
  raw_days: 1          # 1 s values
  detailed_days: 7     # 10 s aggregates
  aggregate_days: 30   # 1 min aggregates
  flow_days: 7
  event_days: 90
  # Individual pings: about 14 MB per day that no evaluation reads.
  # Only enable for troubleshooting.
  ping_samples: false
  # Emergency brake against a full memory card. If the limit is exceeded, raw
  # data is deleted first, then 1 s values, then 10 s values. 0 = no limit.
  max_db_mb: 1024
# The daily summary (daily_stats) is exempt from retention:
# about 200 bytes per day, and in return the long-term comparison stays possible for years.

deep_capture:
  enabled: false       # PCAP ring buffer (headers only), off by default
  max_files: 5         # running files in the ring
  file_size_mb: 50     # size per file
  # IMPORTANT: max_files × file_size_mb only limits the running ring. Files that
  # belong to an incident are taken out of the ring so that they are not
  # overwritten - without the following limits the directory keeps growing with
  # the number of incidents. max_total_mb is the upper limit for EVERYTHING together.
  max_total_mb: 1024   # hard limit for the whole pcap directory
  protected_days: 7    # incident captures are kept at most this long
  # For what a capture is kept at all:
  #   none     only for reported lag ("I JUST HAD LAG")
  #   critical additionally for critical incidents   (default)
  #   all      for every incident - can cost a lot of space depending on frequency
  protect_auto: critical

dev_mode: false        # true = simulated demo data (never in production)
